<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS | Galaxy Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #455a64; --bg: #f5f5f5; --text: #263238; }
        .theme-ekonomi { --primary: #b8860b; --bg: #fffde7; } 
        .theme-sejarah { --primary: #b71c1c; --bg: #fbe9e7; } 
        .theme-geografi { --primary: #0277bd; --bg: #e3f2fd; } 
        .theme-sosiologi { --primary: #4a148c; --bg: #f3e5f5; } 

        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* MARQUEE */
        .marquee-wrapper { width: 100%; background: var(--primary); color: white; padding: 12px 0; overflow: hidden; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .marquee-text { display: inline-block; white-space: nowrap; animation: scroll-text 20s linear infinite; font-weight: 700; }
        @keyframes scroll-text { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        /* SECTIONS */
        .section { min-height: 90vh; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .active { display: flex; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* BUTTONS */
        .btn-grid { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-top: 25px; }
        .nav-btn { padding: 15px 30px; border: 2px solid var(--primary); border-radius: 15px; background: white; color: var(--primary); font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .nav-btn:hover { background: var(--primary); color: white; transform: translateY(-3px); }

        /* CARDS & MEDIA */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; width: 100%; max-width: 1200px; padding: 20px; }
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 100%; }
        .media-container { width: 100%; height: 230px; background: #000; position: relative; overflow: hidden; }
        .media-container iframe, .media-container video, .media-container img { width: 100%; height: 100%; object-fit: cover; border: none; }
        .media-container img { cursor: zoom-in; }
        
        .card-body { padding: 20px; text-align: left; flex-grow: 1; }
        .card-body b { color: var(--primary); font-size: 1.1rem; display: block; margin-bottom: 5px; }
        .desc-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: #eceff1; color: #455a64; text-decoration: none; font-weight: bold; font-size: 0.75rem; border: 1px solid #cfd8dc; }
        .desc-link:hover { background: var(--primary); color: white; }

        /* ZOOM OVERLAY (FULL SCREEN IMAGE) */
        #zoom-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
        #zoom-overlay img { max-width: 95%; max-height: 90vh; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5); transform: scale(0.9); animation: zoomIn 0.3s forwards; }
        @keyframes zoomIn { to { transform: scale(1); } }

        /* FLOATING CONTROLS */
        .fab-container { position: fixed; bottom: 30px; right: 30px; z-index: 1000; }
        .fab { width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 3px solid white; }
        .mute-btn { position: fixed; bottom: 30px; left: 30px; width: 50px; height: 50px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; border: 2px solid white; font-size: 20px; opacity: 0.7; }

        /* MODAL KOMENTAR */
        #comment-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .comment-box { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 400px; text-align: center; border: 4px solid var(--primary); }
        .comment-box input, .comment-box textarea { width: 100%; margin-bottom: 15px; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-family: inherit; }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <audio id="bgm" src="BGM3.mp3" loop></audio>

    <div id="zoom-overlay" onclick="closeZoom()">
        <img id="zoomed-img" src="">
    </div>

    <div class="marquee-wrapper">
        <div class="marquee-text" id="marquee">Selamat Datang di Database IPS. Pilih sub-bidang studi.</div>
    </div>

    <section id="step-1" class="section active">
        <h1>Database Pusat IPS</h1>
        <div class="btn-grid">
            <button class="nav-btn" onclick="choose('Ekonomi', 'theme-ekonomi', 'Sektor Strategis IPC')">💰 Ekonomi</button>
            <button class="nav-btn" onclick="choose('Sejarah', 'theme-sejarah', 'Arsip Sejarah Xianzhou')">📜 Sejarah</button>
            <button class="nav-btn" onclick="choose('Geografi', 'theme-geografi', 'Ekosistem Belobog')">🌍 Geografi</button>
            <button class="nav-btn" onclick="choose('Sosiologi', 'theme-sosiologi', 'Kultur Penacony')">👥 Sosiologi</button>
        </div>
    </section>

    <section id="step-2" class="section">
        <h1>Pilih Tingkatan</h1>
        <div class="btn-grid">
            <button class="nav-btn" onclick="setKelas('10')">Level 10</button>
            <button class="nav-btn" onclick="setKelas('11')">Level 11</button>
            <button class="nav-btn" onclick="setKelas('12')">Level 12</button>
        </div>
    </section>

    <section id="step-3" class="section">
        <h1>Pilih Semester</h1>
        <div class="btn-grid">
            <button class="nav-btn" onclick="render('1')">Semester 1</button>
            <button class="nav-btn" onclick="render('2')">Semester 2</button>
        </div>
    </section>

    <section id="step-4" class="section" style="justify-content: flex-start; padding-top: 50px;">
        <h1 id="final-header">Arsip Terverifikasi</h1>
        <div class="grid" id="display-grid"></div>
        <button class="nav-btn" onclick="location.reload()" style="margin:40px 0;">Kembali ke Index</button>
    </section>

    <div class="mute-btn" id="mute-toggle" onclick="toggleMute()">🔊</div>
    <div class="fab-container">
        <div class="fab" onclick="toggleComment()">💬</div>
    </div>

    <div id="comment-modal">
        <div class="comment-box">
            <h3>Kirim Masukan</h3>
            <p id="context-info" style="font-size:0.7rem; color:#888; margin-bottom:15px;"></p>
            <input type="text" id="comm-nama" placeholder="Nama Anda...">
            <textarea id="comm-pesan" placeholder="Tulis pesan..." rows="4"></textarea>
            <button class="submit-btn" onclick="sendComment()">Kirim</button>
            <p onclick="toggleComment()" style="margin-top:15px; cursor:pointer; color:gray; font-size:0.8rem;">Batal</p>
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxNhGk0y4qreJvO29urhClIZ3HaNUhtNHBD9BNbfys6T22uOFXQ6hamwPi26rf_aXYMiV8-b9Z7mKw/pub?output=csv";
        
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeeHCt_KstWW7_7632WEJXiPgEoCt4JSJF16gjLLuswJR-2UQ/formResponse";
        const ENTRY_NAMA  = "entry.2076614683"; 
        const ENTRY_PESAN = "entry.251772065";
        const ENTRY_MAPEL = "entry.1737093781"; 
        const ENTRY_KELAS = "entry.1800426850"; 
        const ENTRY_SEM   = "entry.1347069065"; 

        let rawData = [];
        let state = { mapel: '', kelas: '', sem: '' };

        async function init() {
            try {
                const res = await fetch(csvUrl);
                const text = await res.text();
                const rows = text.split(/\r?\n/).slice(1);
                rawData = rows.map(row => {
                    const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return { k: c[0]?.replace(/"/g,''), m: c[1]?.replace(/"/g,''), s: c[2]?.replace(/"/g,''), j: c[3]?.replace(/"/g,''), l: c[4]?.replace(/"/g,''), d: c[5]?.replace(/"/g,''), t: c[6]?.replace(/"/g,'') };
                }).filter(x => x.j);
            } catch (e) { console.error("Load Error"); }
        }

        function choose(m, theme, txt) {
            state.mapel = m; document.body.className = theme;
            document.getElementById('marquee').innerText = txt;
            nav(2);
        }

        function setKelas(k) {
            state.kelas = k;
            const bgm = document.getElementById('bgm');
            bgm.volume = 0.2; bgm.play().catch(()=>{});
            nav(3);
        }

        function render(s) {
            state.sem = s;
            const grid = document.getElementById('display-grid');
            const filtered = rawData.filter(x => x.m === state.mapel && x.k === state.kelas && x.s === state.sem);
            grid.innerHTML = filtered.length ? '' : '<h3>Data tidak ditemukan.</h3>';

            filtered.forEach(item => {
                let mediaUrl = item.l.split(',')[0].trim();
                let mediaTag = `<img src="${mediaUrl}" onclick="openZoom('${mediaUrl}')" onerror="this.src='https://via.placeholder.com/400x230?text=No+Image'">`;
                
                if(mediaUrl.includes('drive.google.com')) {
                    const id = mediaUrl.split('/d/')[1]?.split('/')[0] || mediaUrl.split('id=')[1];
                    mediaTag = `<iframe src="https://drive.google.com/file/d/${id}/preview"></iframe>`;
                } else if(mediaUrl.match(/\.(mp4|webm)$/i)) {
                    mediaTag = `<video controls src="${mediaUrl}"></video>`;
                }

                let desc = item.d;
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                desc = desc.replace(urlRegex, (url) => {
                    let label = "🔗 BUKA LINK";
                    if(url.toLowerCase().includes('.pdf')) label = "📄 DOWNLOAD PDF";
                    if(url.toLowerCase().includes('.mp4')) label = "🎥 LIHAT VIDEO";
                    return `<br><a href="${url}" target="_blank" class="desc-link">${label}</a>`;
                });

                grid.innerHTML += `
                    <div class="card">
                        <div class="media-container">${mediaTag}</div>
                        <div class="card-body">
                            <small style="color:#999; font-size:0.7rem">${item.t || ''}</small>
                            <b>${item.j}</b>
                            <p style="font-size:0.85rem; line-height:1.4">${desc}</p>
                        </div>
                    </div>`;
            });
            nav(4);
        }

        // ZOOM FUNCTIONS
        function openZoom(src) {
            const overlay = document.getElementById('zoom-overlay');
            const img = document.getElementById('zoomed-img');
            img.src = src;
            overlay.style.display = 'flex';
        }
        function closeZoom() {
            document.getElementById('zoom-overlay').style.display = 'none';
        }

        function nav(s) {
            document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
            document.getElementById('step-' + s).classList.add('active');
            window.scrollTo(0,0);
        }

        function toggleMute() {
            const bgm = document.getElementById('bgm');
            const btn = document.getElementById('mute-toggle');
            bgm.muted = !bgm.muted;
            btn.innerText = bgm.muted ? "×" : "🔊";
            btn.style.opacity = bgm.muted ? "0.5" : "0.8";
        }

        function toggleComment() {
            const m = document.getElementById('comment-modal');
            const info = document.getElementById('context-info');
            info.innerText = `Kategori: ${state.mapel} | Lvl: ${state.kelas} | Sem: ${state.sem}`;
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        async function sendComment() {
            const nama = document.getElementById('comm-nama').value;
            const pesan = document.getElementById('comm-pesan').value;
            if(!nama || !pesan) return alert("Isi nama dan pesan!");

            const formData = new FormData();
            formData.append(ENTRY_NAMA, nama);
            formData.append(ENTRY_PESAN, pesan);
            formData.append(ENTRY_MAPEL, state.mapel);
            formData.append(ENTRY_KELAS, state.kelas);
            formData.append(ENTRY_SEM, state.sem);

            try {
                fetch(FORM_URL, { method: 'POST', body: formData, mode: 'no-cors' });
                alert("Pesan terkirim ke arsip!");
                toggleComment();
                document.getElementById('comm-pesan').value = "";
            } catch (e) { alert("Error mengirim pesan."); }
        }

        window.onload = init;
    </script>
</body>
</html>
