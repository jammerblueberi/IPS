<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS | Galaxy Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #455a64; --bg: #f5f5f5; --text: #263238; }
        .theme-ekonomi { --primary: #b8860b; --bg: #fffde7; } 
        .theme-sejarah { --primary: #b71c1c; --bg: #fbe9e7; } 
        .theme-geografi { --primary: #0277bd; --bg: #e3f2fd; } 
        .theme-sosiologi { --primary: #4a148c; --bg: #f3e5f5; } 

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* MARQUEE & HEADER */
        .marquee-wrapper { width: 100%; background: var(--primary); color: white; padding: 12px 0; overflow: hidden; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .marquee-text { display: inline-block; white-space: nowrap; animation: scroll-text 20s linear infinite; font-weight: 700; }
        @keyframes scroll-text { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        /* SECTIONS */
        .section { min-height: 90vh; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .active { display: flex; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* BUTTONS */
        .btn-grid { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-top: 25px; }
        .nav-btn { padding: 15px 30px; border: 2px solid var(--primary); border-radius: 15px; background: white; color: var(--primary); font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .nav-btn:hover { background: var(--primary); color: white; transform: translateY(-3px); }

        /* CARDS & GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; width: 100%; max-width: 1200px; padding: 20px; margin-bottom: 80px; }
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 100%; border: 1px solid rgba(0,0,0,0.05); }
        .card-body { padding: 20px; text-align: left; flex-grow: 1; }
        .card-body b { color: var(--primary); font-size: 1.1rem; display: block; margin-bottom: 5px; }

        /* MEDIA & CAROUSEL */
        .media-container { width: 100%; height: 230px; background: #000; position: relative; overflow: hidden; }
        .carousel-container { position: relative; width: 100%; height: 100%; }
        .carousel-item { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; cursor: zoom-in; }
        .carousel-item.active { opacity: 1; z-index: 1; }
        @media (min-width: 1024px) { .carousel-item:hover { transform: scale(1.08); } }

        .caro-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); color: white; border: none; padding: 10px; cursor: pointer; z-index: 5; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }
        .caro-btn:hover { background: var(--primary); }
        .prev { left: 10px; } .next { right: 10px; }

        .caro-dots { position: absolute; bottom: 8px; width: 100%; display: flex; justify-content: center; gap: 4px; z-index: 5; }
        .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.4); border-radius: 50%; }
        .dot.active { background: white; width: 15px; border-radius: 10px; }

        /* LIGHTBOX ZOOM */
        #zoom-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; backdrop-filter: blur(5px); }
        #zoom-overlay img { max-width: 95%; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,0.5); object-fit: contain; transform: scale(0.9); animation: zoomEffect 0.3s forwards; }
        @keyframes zoomEffect { to { transform: scale(1); } }

        /* FLOATING CONTROLS */
        .mute-btn { position: fixed; bottom: 25px; left: 25px; width: 50px; height: 50px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; border: 3px solid white; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* MODAL */
        #comment-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .comment-box { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; border: 4px solid var(--primary); }
        .comment-box input, .comment-box textarea { width: 100%; margin-bottom: 12px; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-family: inherit; }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; }
    </style>
</head>
<body onclick="startAudioOnce()">

    <audio id="bgm" src="BGM3.mp3" loop></audio>

    <div id="zoom-overlay" onclick="this.style.display='none'">
        <img id="zoomed-img" src="">
    </div>

    <div class="marquee-wrapper">
        <div class="marquee-text" id="marquee">Memuat Database...</div>
    </div>

    <section id="step-1" class="section active">
        <h1>Database Pusat IPS</h1>
        <div class="btn-grid">
            <button class="nav-btn" onclick="choose('Ekonomi', 'theme-ekonomi', 'Sektor Strategis IPC')">💰 Ekonomi</button>
            <button class="nav-btn" onclick="choose('Sejarah', 'theme-sejarah', 'Arsip Sejarah Xianzhou')">📜 Sejarah</button>
            <button class="nav-btn" onclick="choose('Geografi', 'theme-geografi', 'Ekosistem Belobog')">🌍 Geografi</button>
            <button class="nav-btn" onclick="choose('Sosiologi', 'theme-sosiologi', 'Kultur Penacony')">👥 Sosiologi</button>
        </div>
    </section>

    <section id="step-2" class="section">
        <h1>Pilih Tingkatan</h1>
        <div class="btn-grid">
            <button class="nav-btn" onclick="setKelas('10')">Level 10</button>
            <button class="nav-btn" onclick="setKelas('11')">Level 11</button>
            <button class="nav-btn" onclick="setKelas('12')">Level 12</button>
        </div>
    </section>

    <section id="step-3" class="section">
        <h1>Pilih Semester</h1>
        <div class="btn-grid">
            <button class="nav-btn" onclick="render('1')">Semester 1</button>
            <button class="nav-btn" onclick="render('2')">Semester 2</button>
        </div>
    </section>

    <section id="step-4" class="section" style="justify-content: flex-start; padding-top: 50px;">
        <h1 id="final-header">Arsip Terverifikasi</h1>
        <div class="grid" id="display-grid"></div>
        <button class="nav-btn" onclick="location.reload()" style="margin-bottom: 50px;">Kembali ke Menu</button>
    </section>

    <div class="mute-btn" id="mute-toggle" onclick="toggleMute()">🔊</div>
    <div class="fab" onclick="toggleComment()">💬</div>

    <div id="comment-modal">
        <div class="comment-box">
            <h3>Kirim Masukan</h3>
            <p id="context-info" style="font-size:0.7rem; color:#888; margin-bottom:10px; font-weight:bold"></p>
            <input type="text" id="comm-nama" placeholder="Nama Anda...">
            <textarea id="comm-pesan" placeholder="Tulis masukan..." rows="4"></textarea>
            <button class="submit-btn" onclick="sendComment()">Kirim</button>
            <p onclick="toggleComment()" style="margin-top:10px; cursor:pointer; font-size:0.8rem; color:gray">Batal</p>
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxNhGk0y4qreJvO29urhClIZ3HaNUhtNHBD9BNbfys6T22uOFXQ6hamwPi26rf_aXYMiV8-b9Z7mKw/pub?output=csv";
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeeHCt_KstWW7_7632WEJXiPgEoCt4JSJF16gjLLuswJR-2UQ/formResponse";
        
        const ENTRY_NAMA = "entry.2076614683"; 
        const ENTRY_PESAN = "entry.251772065";
        const ENTRY_MAPEL = "entry.1737093781"; 
        const ENTRY_KELAS = "entry.1800426850"; 
        const ENTRY_SEM = "entry.1347069065"; 

        let rawData = [];
        let state = { mapel: '', kelas: '', sem: '' };
        let isAudioStarted = false;
        let currentSlides = {};

        async function init() {
            try {
                const res = await fetch(csvUrl);
                const text = await res.text();
                const rows = text.split(/\r?\n/).slice(1);
                rawData = rows.map(row => {
                    const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return { k: c[0]?.replace(/"/g,''), m: c[1]?.replace(/"/g,''), s: c[2]?.replace(/"/g,''), j: c[3]?.replace(/"/g,''), l: c[4]?.replace(/"/g,''), d: c[5]?.replace(/"/g,''), t: c[6]?.replace(/"/g,'') };
                }).filter(x => x.j);
                document.getElementById('marquee').innerText = "Selamat Datang di Database IPS. Pilih sub-bidang studi.";
            } catch (e) { console.error("Database Error"); }
        }

        function startAudioOnce() {
            if (!isAudioStarted) {
                const bgm = document.getElementById('bgm');
                bgm.volume = 0.2; bgm.play().catch(() => {});
                isAudioStarted = true;
            }
        }

        function toggleMute() {
            const bgm = document.getElementById('bgm');
            bgm.muted = !bgm.muted;
            document.getElementById('mute-toggle').innerText = bgm.muted ? "🔇" : "🔊";
        }

        function choose(m, theme, txt) {
            state.mapel = m; document.body.className = theme;
            document.getElementById('marquee').innerText = txt;
            nav(2);
        }

        function setKelas(k) { state.kelas = k; nav(3); }

        function render(s) {
            state.sem = s;
            const grid = document.getElementById('display-grid');
            const filtered = rawData.filter(x => x.m === state.mapel && x.k === state.kelas && x.s === state.sem);
            grid.innerHTML = filtered.length ? '' : '<h3>Arsip belum tersedia.</h3>';

            filtered.forEach((item, cardIdx) => {
                const links = item.l.split(',').map(l => l.trim());
                let mediaHTML = "";

                if (links.length > 1) {
                    mediaHTML = `
                        <div class="carousel-container" id="caro-${cardIdx}">
                            ${links.map((url, i) => `<img src="${url}" class="carousel-item ${i === 0 ? 'active' : ''}" onclick="openZoom('${url}')" data-idx="${i}">`).join('')}
                            <button class="caro-btn prev" onclick="moveSlide(${cardIdx}, -1)">❮</button>
                            <button class="caro-btn next" onclick="moveSlide(${cardIdx}, 1)">❯</button>
                            <div class="caro-dots">${links.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('')}</div>
                        </div>`;
                } else {
                    let url = links[0];
                    if(url.includes('drive.google.com')) {
                        const id = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1];
                        mediaHTML = `<iframe src="https://drive.google.com/file/d/${id}/preview"></iframe>`;
                    } else if(url.match(/\.(mp4|webm)$/i)) {
                        mediaHTML = `<video controls src="${url}"></video>`;
                    } else {
                        mediaHTML = `<img src="${url}" class="carousel-item active" onclick="openZoom('${url}')">`;
                    }
                }

                grid.innerHTML += `
                    <div class="card">
                        <div class="media-container">${mediaHTML}</div>
                        <div class="card-body">
                            <small style="color:#999; font-size:0.7rem">${item.t || ''}</small>
                            <b>${item.j}</b>
                            <p style="font-size:0.85rem">${item.d}</p>
                        </div>
                    </div>`;
            });
            nav(4);
        }

        function moveSlide(cardIdx, dir) {
            const container = document.getElementById(`caro-${cardIdx}`);
            const slides = container.querySelectorAll('.carousel-item');
            const dots = container.querySelectorAll('.dot');
            if (!currentSlides[cardIdx]) currentSlides[cardIdx] = 0;

            slides[currentSlides[cardIdx]].classList.remove('active');
            dots[currentSlides[cardIdx]].classList.remove('active');
            
            currentSlides[cardIdx] = (currentSlides[cardIdx] + dir + slides.length) % slides.length;
            
            slides[currentSlides[cardIdx]].classList.add('active');
            dots[currentSlides[cardIdx]].classList.add('active');
        }

        function openZoom(src) {
            document.getElementById('zoomed-img').src = src;
            document.getElementById('zoom-overlay').style.display = 'flex';
        }

        function nav(s) {
            document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
            document.getElementById('step-' + s).classList.add('active');
            window.scrollTo(0,0);
        }

        function toggleComment() {
            const m = document.getElementById('comment-modal');
            document.getElementById('context-info').innerText = `${state.mapel} | Lvl ${state.kelas} | Sem ${state.sem}`;
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        async function sendComment() {
            const n = document.getElementById('comm-nama').value;
            const p = document.getElementById('comm-pesan').value;
            if(!n || !p) return alert("Isi nama & pesan!");

            const f = new FormData();
            f.append(ENTRY_NAMA, n); f.append(ENTRY_PESAN, p);
            f.append(ENTRY_MAPEL, state.mapel); f.append(ENTRY_KELAS, state.kelas); f.append(ENTRY_SEM, state.sem);

            try {
                fetch(FORM_URL, { method: 'POST', body: f, mode: 'no-cors' });
                alert("Terkirim!"); toggleComment();
                document.getElementById('comm-pesan').value = "";
            } catch (e) { alert("Error!"); }
        }

        window.onload = init;
    </script>
</body>
</html>
